[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loadforge"
version = "0.1.0"
description = "LLM API load tester: drives concurrent chat-completion traffic at an OpenAI-compatible endpoint and reports latency percentiles and token cost."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Rout" }]
keywords = ["flask", "service", "gpt_load"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "Flask>=3.0",
  "Flask-SQLAlchemy>=3.1",
  "SQLAlchemy>=2.0",
  "PyYAML>=6.0",
  "aiohttp",
  "tiktoken",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.6",
  "pre-commit>=4.7.0",
  "types-PyYAML",
  "types-requests",
  "coverage>=7.5",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://example.invalid/gpt_load"
Documentation = "https://example.invalid/gpt_load/docs"
Issues = "https://example.invalid/gpt_load/issues"

[project.scripts]
loadforge = "gpt_load.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpt_load = ["py.typed", "app.py", "http.py", "observability.py", "paths.py", "templates/*", "static/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q -ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
# The floor sits five points under the coverage measured on this
# checkout at v0.1.0, so a real regression fails the gate and a few new
# lines do not.
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]


# lint ignores — every rule below is a deliberate exception:
#   B017: the test asserts a broad failure on purpose
#   E501: line length is enforced by ruff format, not by the linter
#   N818: exception names are public API and predate the Error-suffix rule
#   RUF005: explicit list concatenation reads better here
#   S101: tests assert
#   S104: the service binds 0.0.0.0 by design
#   S105: test fixtures use obvious placeholder credentials
#   S603: subprocess runs with an explicit argv list and no shell
#   UP031: percent-formatting keeps logging arguments lazy
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
  "B017",
  "E501",
  "N818",
  "RUF005",
  "S101",
  "S104",
  "S105",
  "S603",
  "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["gpt_load"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["flask.*", "werkzeug.*", "sqlalchemy.*", "flask_sqlalchemy.*", "aiohttp.*", "tiktoken.*", "yaml.*"]
ignore_missing_imports = true

# flask_sqlalchemy stores the declarative base on the extension instance, so the
# base class of Run and Sample is a plain Any; subclassing it is correct and
# intentional, and this is the only module where it happens.
[[tool.mypy.overrides]]
module = ["gpt_load.models", "models"]
disallow_subclassing_any = false

[tool.bandit]
# Reviewed findings, each inherent to the architecture:
#   B104: the service binds 0.0.0.0 inside a container; the port is the contract
skips = ["B104"]
